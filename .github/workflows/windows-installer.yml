name: Windows installer
on: workflow_dispatch
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm run setup
      - run: npm run desktop:package
      - run: ./prototype/installer/build.ps1
      - name: Install, launch twice and uninstall
        run: ./prototype/installer/test-install.ps1 (Get-Item release/Castiel-Setup-*-win-x64.exe).FullName
      - name: Publish verified installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content prototype/package.json -Raw | ConvertFrom-Json).version
          $file = Get-Item "release/Castiel-Setup-$version-win-x64.exe"
          $sha = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  $($file.Name)" | Set-Content release/SHA256SUMS.txt -Encoding ascii
          gh release create "v$version" $file.FullName release/SHA256SUMS.txt --target $env:GITHUB_SHA --title "Castiel $version · Windows 11 x64" --notes "Windows x64 per-user installer. Install, startup, persistence and uninstall checked on Windows Server 2025. SHA-256 is included."
